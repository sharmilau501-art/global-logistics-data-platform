name: Local logistics platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install free Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-stream.txt -r requirements-warehouse.txt
      - name: Run unit and DuckDB integration tests
        run: python -m pytest -q
